version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=agrosense
      - POSTGRES_PASSWORD=agrosense
      - POSTGRES_DB=agrosense
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrosense -d agrosense"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://agrosense:agrosense@db:5432/agrosense
      - SECRET_KEY=${SECRET_KEY:-agrosense-ai-local-secret-change-me}
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_URL=http://localhost:8000
      - EMAIL_MODE=${EMAIL_MODE:-console}
      - REQUIRE_EMAIL_VERIFICATION=${REQUIRE_EMAIL_VERIFICATION:-False}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./backend/ml_models:/app/ml_models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
