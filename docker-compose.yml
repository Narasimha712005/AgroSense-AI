version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./agrosense.db
      - SECRET_KEY=agrosense-ai-production-secret
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend/ml_models:/app/ml_models
      - sqlite_data:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
